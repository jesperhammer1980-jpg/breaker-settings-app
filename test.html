<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BreakerSettings</title><link rel="stylesheet" href="style.css"></head><body><div style="position:fixed;right:10px;bottom:10px;z-index:9999;padding:8px 12px;border-radius:8px;background:#143;color:#9f9;font:700 12px Arial">TESTVERSION v6.9</div><main class="app"><aside class="panel left"><h1>Breaker<span>Settings</span></h1><p class="subtitle">TEST v6.9 · NS settings + backup filter</p><div class="testBanner">TESTSIDE - live er ikke overskrevet</div><label>Fabrikat</label><select id="brand"></select><label>Serie</label><select id="series"></select><label>Bryder/frame</label><select id="frame"></select><label>Kortslutningsholdbarhed</label><select id="cls"></select><label>Relætype</label><select id="relay"></select><label>Relæstørrelse / In</label><select id="rating"></select><label>Polantal</label><select id="poles"></select><label>Ønsket indstillingsstrøm</label><input id="desired" type="text" inputmode="decimal" value="125"><label>Ik min. kA</label><input id="ikmin" type="text" inputmode="decimal" value="3,1"><label>Ik max. kA</label><input id="ikmax" type="text" inputmode="decimal" value="14"><label>INC manuel værdi</label><input id="inc" type="text" inputmode="decimal" value="160"><label>Metode</label><select id="method"><option>Calculated settings</option><option>Minimum settings</option></select><a class="mailBtn" href="mailto:jhj@pro-automatic.dk?subject=Forslag%20til%20BreakerSettings">Send forslag på mail</a><div id="stats" class="statsBox"></div></aside><section class="panel center"><div class="device-card"><img id="img" alt="Bryder"><div><span id="badge" class="badge"></span><h2 id="title"></h2><p id="sub"></p><div class="chips"><span id="chipFrame"></span><span id="chipClass"></span><span id="chipRating"></span><span id="chipPoles"></span></div></div></div><div id="warning" class="warning hidden"></div><div id="requestWarning" class="warning hidden"></div><h3>Beregnede indstillinger</h3><table><thead><tr><th>Funktion</th><th>Min - indstilling - max</th><th>Resultat</th></tr></thead><tbody id="rows"></tbody></table><h3>Direkte kataloglinks</h3><div id="docs" class="docs"></div><h3>Backup / cascading ved 415V</h3><div class="backupFilter"><label>Backup-komponent</label><select id="backupComponent"><option value="all">Alle verificerede</option><option value="IC60">iC60</option><option value="NG125">NG125</option><option value="IC40N">iC40N</option><option value="ICV40N">iCV40N</option></select></div><div id="backupPanel" class="backupPanel"></div></section><aside class="panel right"><div id="irSettingWrap" class="hidden"><h3>NS Ir setting type</h3><div id="irSettings" class="plugs"></div></div><div class="result-header"><h3>Resultat til dokumentation</h3><button id="copy">Kopiér</button></div><pre id="output" class="output"></pre></aside></main><script src="app-test.js"></script></body></html>
