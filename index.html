<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Breaker Settings</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <main class="app">
    <aside class="panel left">
      <h1>Breaker<span>Settings</span></h1>
      <p class="subtitle">Statisk v3.10 · rollback + instant fixed</p>
      <label>Fabrikat</label><select id="brand"></select>
      <label>Serie</label><select id="series"></select>
      <label>Bryder</label><select id="frame"></select>
      <label>Kortslutningsholdbarhed</label><select id="breakingClass"></select>
      <label>Relæ</label><select id="relay"></select>
      <label>Polantal</label><select id="poles"></select>
      <label>Ønsket indstillingsstrøm</label><input id="desired" type="text" inputmode="decimal" value="90"/>
      <label>Ik min. kA</label><input id="ikmin" type="text" inputmode="decimal" value="3,1"/>
      <label>Ik max. kA</label><input id="ikmax" type="text" inputmode="decimal" value="14"/>
      <label>INC manuel værdi</label><input id="inc" type="text" inputmode="decimal" value="100"/>
      <label>Metode</label><select id="method"><option>Calculated settings</option><option>Minimum settings</option></select>
      <a class="mailBtn" href="mailto:jhj@pro-automatic?subject=Forslag%20til%20BreakerSettings">Send forslag på mail</a>
    <div id="statsPanel" class="statsBox"></div>
    </aside>
    <section class="panel center">
      <div class="device-card"><img id="img" alt="Bryder"/><div><span id="status" class="badge ok"></span><h2 id="title"></h2><p id="subtitle2"></p><div class="chips"><span id="chipFrame"></span><span id="chipClass"></span><span id="chipPoles"></span></div></div></div>
      <div id="warning" class="warning hidden"></div>
      <h3>Beregnede indstillinger</h3>
      <table><thead><tr><th>Funktion</th><th>Min - indstilling - max</th><th>Resultat</th></tr></thead><tbody id="rows"></tbody></table>
      <h3>Direkte kataloglinks</h3><div id="docs" class="docs"></div>
    </section>
    <aside class="panel right">
      <div id="settingWrap" class="hidden"><h3>Ir setting type</h3><div id="settingTypes" class="plugs"></div></div><div id="plugWrap"><h3>Rating plug valg</h3><div id="plugs" class="plugs"></div></div>
      <div class="result-header"><h3>Resultat til dokumentation</h3><button id="copy">Kopiér</button></div>
      <pre id="output" class="output"></pre>
    </aside>
  </main>
<script src="app.js"></script>
</body>
</html>
